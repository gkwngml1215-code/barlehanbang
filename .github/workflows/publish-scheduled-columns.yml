name: Publish scheduled columns

on:
  schedule:
    - cron: "5 0 * * *"
    - cron: "5 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-scheduled-columns
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check due publication
        id: due
        shell: bash
        run: |
          today="$(TZ=Asia/Seoul date +%F)"
          build_info="$(curl --fail --silent --show-error "https://sr-bareul.co.kr/build-info.json?t=$(date +%s)")"
          next_scheduled="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).nextScheduled || "")' "$build_info")"
          if [[ -n "$next_scheduled" && ( "$next_scheduled" < "$today" || "$next_scheduled" == "$today" ) ]]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "today=$today" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "No scheduled column is due (next: ${next_scheduled:-none}, today: $today)."
          fi

      - name: Trigger Cloudflare Pages build
        if: steps.due.outputs.due == 'true'
        env:
          TODAY: ${{ steps.due.outputs.today }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s %s\n' "$TODAY" "$(date -u +%FT%TZ)" > .scheduled-publication-trigger
          git add .scheduled-publication-trigger
          git commit -m "Trigger scheduled column publication ($TODAY)"
          git push